[package]
name = "atray"
version = "1.0.0"
description = "atray：WebUI 薄壳（全屏覆盖层 + 插件 + 快捷键）"
edition = "2021"

# 独立 workspace：不并入根 workspace（避免与 anm-core 等成员互相牵连）
[workspace]

[lib]
name = "atray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"

# Linux Wayland 全局热键：XDG Desktop Portal GlobalShortcuts（跨 KDE/GNOME 等桌面）
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["global_shortcuts"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures-util = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
