[package]
name = "atray"
version = "0.1.0"
description = "atray：WebUI 薄壳（全屏覆盖层 + 插件 + 快捷键）"
edition = "2021"

# 独立 workspace：不并入根 workspace（避免与 anm-core 等成员互相牵连）
[workspace]

[lib]
name = "atray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
