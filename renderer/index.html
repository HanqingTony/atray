<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>atray</title>
<style>
  :root {
    --bg: #161a22;
    --card: #262a33;
    --card-border: #444a55;
    --accent: #5fbeff;
    --text: #d6dae2;
    --text-dim: #8f96a3;
    --input-bg: #22252c;
    --warm: #f5c86e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: transparent;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    user-select: none;
  }
  #overlay { position: fixed; inset: 0; background: rgba(8, 10, 16, 0.62); }
  #empty-hint {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center;
    padding-top: 16vh;
    gap: 0;
    color: var(--text-dim); font-size: 15px;
    z-index: 1; pointer-events: none;
  }
  /* atray 艺术大标题：细体 + 渐变文字 + 大字号占上半区 + 半透明 */
  #empty-hint .big {
    font-size: clamp(90px, 30vh, 320px);
    line-height: 1;
    font-weight: 200;
    letter-spacing: .14em;
    text-indent: .14em;
    color: transparent;
    background: linear-gradient(180deg, rgba(95,190,255,.85) 0%, rgba(95,190,255,.25) 55%, rgba(95,190,255,.06) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    opacity: .55;
    text-transform: uppercase;
    user-select: none;
  }
  .add-webui-btn {
    pointer-events: auto;
    margin-top: 7vh;
    padding: 10px 28px;
    background: var(--input-bg);
    border: 1px solid var(--accent); border-radius: 8px;
    color: var(--accent); font-size: 15px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .add-webui-btn:hover {
    background: #2c3d5c;
    border-color: #8fd0ff;
    color: #ffffff;
    box-shadow: 0 4px 20px rgba(95,190,255,.25);
  }
  .add-webui-btn {
    pointer-events: auto;
    margin-top: 7vh;
    padding: 10px 28px;
    background: var(--input-bg);
    border: 1px solid var(--accent); border-radius: 8px;
    color: var(--accent); font-size: 15px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .add-webui-btn:hover {
    background: #2c3d5c;
    border-color: #8fd0ff;
    color: #ffffff;
    box-shadow: 0 4px 20px rgba(95,190,255,.25);
  }
  #webapp-views { position: fixed; inset: 0; display: none; z-index: 50; }
  #webapp-views iframe { width: 100%; height: 100%; border: none; background: #161a22; }
  /* 隐藏按钮（≡ 快捷键语义）：紧贴屏幕角（布局可配置四角位置） */
  #quit-btn {
    position: fixed;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(30, 33, 40, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 5px;
    color: #aeb6c2; font-size: 12px; line-height: 1;
    cursor: pointer; font-family: inherit;
    z-index: 200;
  }
  #quit-btn:hover { border-color: #ff7878; color: #ff7878; background: rgba(60, 30, 34, 0.8); }
  /* 贴角：仅朝向屏幕中心的角为圆角，其余（贴屏幕边/角的）全直角——
     保证鼠标滑到边缘/角尖不丢 hover，同时保留向内容侧的柔和 */
  #quit-btn.tl { top: 0; left: 0; border-radius: 0 0 6px 0; }   /* 中心侧=右下 */
  #quit-btn.tr { top: 0; right: 0; border-radius: 0 0 0 6px; }  /* 中心侧=左下 */
  #quit-btn.bl { bottom: 0; left: 0; border-radius: 0 6px 0 0; }/* 中心侧=右上 */
  #quit-btn.br { bottom: 0; right: 0; border-radius: 6px 0 0 0; }/* 中心侧=左上 */
  /* 底部工具栏（菜单栏）：位置可配置（左下/右下/底部居中） */
  #bottom-bar {
    position: fixed;
    display: flex; align-items: center; gap: 0;
    z-index: 150;
  }
  #bottom-bar.bl { left: 0; bottom: 0; }
  #bottom-bar.br { right: 0; bottom: 0; }
  #bottom-bar.bc { left: 50%; transform: translateX(-50%); bottom: 0; }
  /* 应用按钮容器：必须是 flex 行（.b-btn 是块级 flex，直接放 span 里会纵向堆叠） */
  #app-btns { display: flex; align-items: center; }
  .b-btn {
    padding: 7px 14px;
    background: var(--input-bg);
    border: 1px solid var(--card-border); border-radius: 0;
    color: var(--text-dim); font-size: 13px;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
    height: 34px;
  }
  .b-btn + .b-btn { margin-left: -1px; }
  .b-btn:hover { border-color: var(--accent); color: var(--accent); z-index: 1; }
  .b-btn.active { border-color: var(--accent); color: var(--accent); background: var(--card); z-index: 1; }
  /* web 应用按钮：图标显示（无图标 = 首字母徽标），名称只进 tooltip */
  .b-btn.app { padding: 3px 6px; min-width: 36px; justify-content: center; }
  .b-btn.app .bi { width: 26px; height: 26px; object-fit: contain; display: block; border-radius: 5px; }
  .b-btn.app .bd {
    width: 26px; height: 26px; border-radius: 6px;
    background: linear-gradient(135deg, #31455c, #222b38);
    border: 1px solid var(--card-border);
    color: var(--accent); font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .hidden { display: none !important; }
  /* 设置面板：左侧纵向卡片式导航 */
  #settings-mask {
    display: none; position: fixed; inset: 0;
    background: rgba(8, 10, 16, 0.6);
    align-items: center; justify-content: center;
    z-index: 300;
  }
  #settings-box {
    width: 720px; max-height: 82vh;
    background: var(--card); border: 1px solid #6a7a8f; border-radius: 12px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
  }
  #settings-box h3 { margin: 0; font-size: 15px; color: var(--accent); }
  .settings-main { display: flex; gap: 14px; flex: 1; min-height: 0; }
  #s-menu {
    display: flex; flex-direction: column; gap: 4px;
    min-width: 104px; padding-right: 12px;
    border-right: 1px solid var(--card-border);
  }
  .s-menu-item {
    padding: 7px 12px; border-radius: 8px;
    border: 1px solid transparent; background: transparent;
    color: var(--text-dim); cursor: pointer;
    font-size: 13px; font-family: inherit; text-align: left;
  }
  .s-menu-item:hover { color: var(--text); background: var(--input-bg); }
  .s-menu-item.active { border-color: var(--card-border); background: var(--input-bg); color: var(--accent); font-weight: 600; }
  #s-body { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; min-width: 0; }
  .s-page { display: flex; flex-direction: column; gap: 8px; }
  #settings-box label { font-size: 12px; color: var(--text-dim); }
  #settings-box input {
    width: 100%; height: 32px;
    background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 6px;
    color: var(--text); font-size: 14px; padding: 0 10px; outline: none; font-family: inherit;
  }
  #settings-box input:focus { border-color: var(--accent); }
  .btn {
    padding: 4px 14px; border-radius: 6px; border: 1px solid var(--card-border);
    background: #303540; color: var(--text); cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); }
  .s-row { display: flex; gap: 8px; justify-content: flex-end; }
  /* 快捷键行 */
  .hk-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--input-bg); border: 1px solid var(--card-border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  .hk-row.capturing { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(95,190,255,.4); }
  .hk-row .hk-name { color: var(--text); flex: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hk-row .hk-value { color: var(--warm); flex: 1; font-size: 13px; letter-spacing: .5px; }
  .hk-row .hk-value.empty { color: var(--text-dim); font-style: italic; }
  .hk-row .btn { padding: 2px 10px; font-size: 12px; }
  #app-list { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; }
  .app-row {
    display: flex; align-items: center; gap: 6px;
    background: var(--input-bg); border: 1px solid var(--card-border);
    border-radius: 6px; padding: 3px 8px; font-size: 13px;
  }
  .app-row.drag-over { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(95,190,255,.35); }
  .app-row.dragging { opacity: .55; border-style: dashed; }
  .app-row.dragging .drag { cursor: grabbing; }
  .app-row .drag {
    cursor: grab; color: var(--text-dim); font-size: 15px;
    padding: 2px 6px; user-select: none; flex: none;
  }
  .app-row .drag:active { cursor: grabbing; }
  /* 顺序列（必须压过 #settings-box input 的 100% 宽度规则） */
  #app-list .app-row .order {
    width: 46px; min-width: 46px; height: 24px; flex: none; text-align: center;
    background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 5px;
    color: var(--warm); font-size: 12px; padding: 0 2px; outline: none; font-family: inherit;
  }
  #app-list .app-row .order:focus { border-color: var(--accent); }
  .app-row .a-name { color: var(--text); flex: none; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app-row .a-url { color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .app-row .a-hot { color: var(--warm); font-size: 12px; flex: none; min-width: 80px; text-align: right; }
  .app-row .btn { padding: 2px 9px; font-size: 12px; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn:disabled:hover { border-color: var(--card-border); }
  .p-add { display: flex; gap: 6px; }
  .p-add input {
    flex: 1; height: 30px;
    background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 6px;
    color: var(--text); font-size: 13px; padding: 0 10px; outline: none; font-family: inherit;
  }
  .p-add input:focus { border-color: var(--accent); }
  #hotkey-err { color: #ff7878; font-size: 12px; min-height: 14px; }
  .pos-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .pos-group .btn { padding: 3px 12px; font-size: 12px; }
  .pos-group .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(95,190,255,.12); }
  /* 通用页选项行（开机启动等） */
  .opt-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--input-bg); border: 1px solid var(--card-border);
    border-radius: 6px; padding: 8px 12px; font-size: 13px;
  }
  .opt-text { color: var(--text); }
  .opt-row .btn { min-width: 72px; }
  .opt-row .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(95,190,255,.12); }
  #autostart-err { color: #ff7878; font-size: 12px; min-height: 14px; }
  .hint { color: var(--text-dim); font-size: 11px; }
</style>
</head>
<body>
<div id="overlay">
  <div id="empty-hint">
    <div class="big">atray</div>
    <button class="add-webui-btn" id="add-webui-btn">＋ 添加web应用</button>
  </div>
  <div id="webapp-views"></div>
  <button id="quit-btn" title="退出 atray">✕</button>
  <div id="bottom-bar">
    <button class="b-btn" id="settings-btn" title="设置（web 应用 / 快捷键 / 布局 / 通用）">⚙ 设置</button>
    <button class="b-btn" id="main-panel-btn" data-webapp="__main__" title="主面板">⏻ 主面板</button>
    <span id="app-btns"></span>
  </div>
  <div id="settings-mask">
    <div id="settings-box">
      <h3>设置</h3>
      <div class="settings-main">
        <div id="s-menu">
          <button class="s-menu-item active" data-menu="apps">web 应用</button>
          <button class="s-menu-item" data-menu="hotkey">快捷键</button>
          <button class="s-menu-item" data-menu="layout">布局</button>
          <button class="s-menu-item" data-menu="general">通用</button>
        </div>
        <div id="s-body">
        <div class="s-page hidden" id="s-page-hotkey">
          <label id="hk-label-main">总快捷键：呼出/隐藏覆盖层（点「设置」后按新组合，即时生效）</label>
          <div class="hk-row" id="main-hk-row">
            <span class="hk-name">总快捷键</span>
            <span class="hk-value" id="main-hk-value">…</span>
            <button class="btn hk-set" id="main-hk-btn">设置</button>
            <button class="btn" id="main-hk-del">删除</button>
          </div>
          <label id="hk-label-app">各 web 应用快捷键：按下直接切换到对应应用（点「设置」后按新组合，Esc 取消）。窗口激活时也可按 Alt+数字（1~9、0=第10个）按列表顺序快速切换</label>
          <div id="app-hk-list"></div>
          <div id="hotkey-err"></div>
        </div>
        <div class="s-page" id="s-page-apps">
          <label>web 应用（输入 URL 添加；拖动 ⠿ 或直接改「顺序」数字调整位置；删除即时生效）</label>
          <div id="app-list"></div>
          <div class="p-add">
            <input id="p-url" placeholder="应用 URL（http(s):// 或 atray://localhost/…）" spellcheck="false">
            <input id="p-name" placeholder="名称（可选）" spellcheck="false">
            <button class="btn" id="p-add-btn">添加</button>
          </div>
        </div>
        <div class="s-page hidden" id="s-page-layout">
          <label>隐藏按钮位置（点击 = 隐藏覆盖层；与菜单栏不能同角）</label>
          <div id="quit-pos-group" class="pos-group"></div>
          <label>菜单栏位置</label>
          <div id="bar-pos-group" class="pos-group"></div>
          <div class="hint">改动即时生效并记忆</div>
        </div>
        <div class="s-page hidden" id="s-page-general">
          <label>启动</label>
          <div class="opt-row">
            <span class="opt-text">开机自动启动（登录 Windows 后后台托盘运行）</span>
            <button class="btn" id="autostart-btn">…</button>
          </div>
          <div id="autostart-err"></div>
        </div>
      </div>
      </div>
      <div class="s-row">
        <button class="btn" id="s-ok">完成</button>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
// ---------- atray 桥（Tauri v2） ----------
const atrayApi = (() => {
  const core = window.__TAURI__.core;
  const evt = window.__TAURI__.event;
  return {
    setConfig: (cfg) => core.invoke('atray_set_config', { cfg }),
    getConfig: () => core.invoke('atray_get_config'),
    setHotkey: (keys) => core.invoke('atray_set_hotkey', { keys }),
    clearHotkey: () => core.invoke('atray_clear_hotkey'),
    getAutostart: () => core.invoke('atray_get_autostart'),
    setAutostart: (enable) => core.invoke('atray_set_autostart', { enable }),
    probeIcons: (url) => core.invoke('atray_probe_icons', { url }),
    hide: () => core.invoke('atray_hide'),
    quit: () => core.invoke('atray_quit'),
    onEvent: (cb) => { evt.listen('atray-event', (e) => cb(e.payload)); },
    onMenu: (cb) => { evt.listen('atray-menu', (e) => cb(e.payload)); },
    onWebappActivate: (cb) => { evt.listen('atray-webapp-activate', (e) => cb(e.payload)); },
  };
})();

// ---------- toast ----------
let toastTimer = null;
function showToast(text) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;top:44px;right:18px;max-width:420px;background:#1c212b;' +
      'border:1px solid #5a82a5;border-radius:10px;color:#d6dae2;font-size:13px;padding:10px 14px;' +
      'box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:400;';
    document.body.appendChild(t);
  }
  t.textContent = text;
  t.style.display = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2600);
}

// ---------- web 应用系统 ----------
const webappViews = document.getElementById('webapp-views');
const emptyHint = document.getElementById('empty-hint');
let webappFrames = {};
let appCfgs = [];        // web 应用列表 [{id, name, url, hotkey}]
let activeWebapp = null; // 当前激活应用 id（null = 主面板）
let mainHotkey = 'Alt+Shift+Z';
let hkBackend = 'native'; // 'native'（Windows/X11 即时注册）| 'portal'（Wayland 系统对话框）
let portalKeys = {};      // portal 绑定结果：{shortcut_id: 系统实际按键描述}

function activateWebapp(id) {
  activeWebapp = id;
  syncActiveUI();
  if (id === null) {
    emptyHint.style.display = 'flex';
    webappViews.style.display = 'none';
  } else {
    emptyHint.style.display = 'none';
    webappViews.style.display = 'block';
    for (const [pid, frame] of Object.entries(webappFrames)) {
      frame.style.display = pid === id ? 'block' : 'none';
    }
  }
}

// ---------- 引擎：图标按钮 / iframe 生命周期 / 本地即时生效 ----------
const appBtnsBox = document.getElementById('app-btns');
const iconProbed = {}; // id -> true：避免重复探测

function iconElOf(p) {
  if (p.icon) {
    const im = document.createElement('img');
    im.className = 'bi';
    im.alt = '';
    im.src = p.icon;
    im.onerror = () => {
      p.icon = null; // 图标失效 → 徽标并清除记录，下次启动再探测
      const tabEl = appBtnsBox.querySelector('.b-btn[data-webapp="' + p.id + '"]');
      if (tabEl) {
        tabEl.querySelectorAll('.bi,.bd').forEach((n) => n.remove());
        tabEl.appendChild(iconElOf(p));
      }
      persistApps();
    };
    return im;
  }
  return badgeElOf(p);
}
function badgeElOf(p) {
  const b = document.createElement('span');
  b.className = 'bd';
  b.textContent = (p.name || p.id || '?').trim().charAt(0).toUpperCase();
  return b;
}
function makeAppTab(p) {
  const tab = document.createElement('button');
  tab.className = 'b-btn app';
  tab.dataset.webapp = p.id;
  tab.title = (p.name || p.id) + ' · ' + p.url + (p.hotkey ? '（热键 ' + p.hotkey + '）' : '');
  tab.onclick = () => activateWebapp(p.id === activeWebapp ? null : p.id);
  tab.appendChild(iconElOf(p));
  return tab;
}
function ensureWebapp(p) {
  if (!webappFrames[p.id]) {
    const frame = document.createElement('iframe');
    frame.src = p.url;
    frame.style.display = 'none';
    webappViews.appendChild(frame);
    webappFrames[p.id] = frame;
  }
  appBtnsBox.appendChild(makeAppTab(p));
}
function removeWebapp(id) {
  const frame = webappFrames[id];
  if (frame) { frame.remove(); delete webappFrames[id]; }
  const tab = appBtnsBox.querySelector('.b-btn[data-webapp="' + id + '"]');
  if (tab) tab.remove();
  if (activeWebapp === id) activateWebapp(null); // 删的是当前激活应用 → 立即回主面板
}
// 只重建按钮区（不动 iframe → 正在用的应用不重载）
function renderBar() {
  appBtnsBox.innerHTML = '';
  for (const p of appCfgs) {
    if (!p.id || !p.url) continue;
    appBtnsBox.appendChild(makeAppTab(p));
  }
  syncActiveUI();
}
function syncActiveUI() {
  const cur = activeWebapp === null ? '__main__' : activeWebapp;
  document.querySelectorAll('#bottom-bar .b-btn').forEach((b) => {
    b.classList.toggle('active', b.dataset.webapp === cur);
  });
}
function buildWebappUI() {
  appBtnsBox.innerHTML = '';
  webappViews.innerHTML = '';
  webappFrames = {};
  for (const p of appCfgs) {
    if (!p.id || !p.url) continue;
    appBtnsBox.appendChild(makeAppTab(p));
    const frame = document.createElement('iframe');
    frame.src = p.url;
    frame.style.display = 'none';
    webappViews.appendChild(frame);
    webappFrames[p.id] = frame;
  }
  syncActiveUI();
}

// favicon 探测：候选 = Rust 抓 HTML 解析的 <link rel=icon> 绝对 URL（http 页面）；
// https 页面无法抓取 → 经典回退 origin/favicon.ico|png。逐个 <img> 实测加载，
// 命中即记入配置并即时更新按钮（都不中 → 保持首字母徽标）。
function probeIcon(p) {
  if (p.icon || iconProbed[p.id]) return;
  iconProbed[p.id] = true;
  let origin = '';
  try {
    const u = new URL(p.url);
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return;
    origin = u.origin;
  } catch (e) { return; }
  const fallback = [origin + '/favicon.ico', origin + '/favicon.png'];
  const tryLoad = (cands) => {
    let k = 0;
    const next = () => {
      if (k >= cands.length) return; // 全部失败 → 保持徽标
      const im = new Image();
      const src = cands[k++];
      im.onload = () => {
        p.icon = src;
        updateTabIcon(p);
        persistApps();
      };
      im.onerror = next;
      im.src = src;
    };
    next();
  };
  // http/https 都走后端 HTML 解析（https 需 TLS，后端 reqwest+rustls 处理）；
  // atray:// 本地页直接回退默认路径探测
  if (p.url.startsWith('http://') || p.url.startsWith('https://')) {
    atrayApi.probeIcons(p.url).then((r) => {
      const list = (r && r.status === 'ok' && Array.isArray(r.data.icons)) ? r.data.icons : [];
      tryLoad(list.length ? list.concat(fallback) : fallback);
    }).catch(() => tryLoad(fallback));
  } else {
    tryLoad(fallback);
  }
}
function updateTabIcon(p) {
  const tabEl = appBtnsBox.querySelector('.b-btn[data-webapp="' + p.id + '"]');
  if (!tabEl) return;
  tabEl.querySelectorAll('.bi,.bd').forEach((n) => n.remove());
  tabEl.appendChild(iconElOf(p));
}

// 持久化（60ms 防抖合并；失败仅提示——界面已按本地状态即时生效）
let saveTimer = null;
function persistApps() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    atrayApi.setConfig({webapps: appCfgs}).then((r) => {
      if (r && r.status === 'error') showToast('保存失败：' + r.data);
    }).catch((e) => showToast('保存失败：' + e));
  }, 60);
}

atrayApi.onWebappActivate((id) => {
  if (!webappFrames[id]) return;
  if (settingsMask.style.display === 'flex') return; // 设置面板打开时不切换
  activateWebapp(id);
});

// Esc：应用中先回主面板；主面板时隐藏窗口
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (settingsMask.style.display === 'flex') { closeSettings(); return; }
    if (activeWebapp !== null) {
      activateWebapp(null);
      e.stopPropagation();
    } else {
      atrayApi.hide();
    }
  }
});

atrayApi.onEvent((event) => {
  if (event === 'shown' && activeWebapp === null && appCfgs.length) {
    activateWebapp(appCfgs[0].id);
  }
});
atrayApi.onMenu(() => { openSettings(); });

// 窗口激活时 Alt+数字：按列表顺序直接切换 web 应用（1=第一个，9=第九个，0=第十个）。
// 注意带 Shift/Ctrl 的组合（如 Alt+Shift+1 应用专属热键）不在此列。
document.addEventListener('keydown', (e) => {
  if (settingsMask.style.display === 'flex') return; // 设置面板打开时不抢键
  if (!e.altKey || e.ctrlKey || e.shiftKey) return;
  let idx;
  if (e.key >= '1' && e.key <= '9') idx = +e.key - 1;
  else if (e.key === '0') idx = 9;
  else return;
  if (idx >= appCfgs.length) return;
  e.preventDefault();
  activateWebapp(appCfgs[idx].id);
});

// ---------- 布局配置（localStorage 记忆；quit 与菜单栏不能同角） ----------
const POS_LABEL = {tl: '左上', tr: '右上', bl: '左下', br: '右下'};
let layout = {quitPos: 'tr', barPos: 'bl'};
const QUIT_ID = document.getElementById('quit-btn');
const BAR_ID = document.getElementById('bottom-bar');

function loadLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem('atray.layout') || '{}');
    if (saved.quitPos) layout.quitPos = saved.quitPos;
    if (saved.barPos) layout.barPos = saved.barPos;
  } catch (e) {}
}
function saveLayout() {
  localStorage.setItem('atray.layout', JSON.stringify(layout));
}
function applyLayout() {
  // 隐藏按钮位置
  QUIT_ID.className = QUIT_ID.className.split(' ')[0] + ' ' + layout.quitPos;
  // 菜单栏位置
  BAR_ID.className = 'bl'; // 重置基础类
  BAR_ID.classList.remove('bl', 'br', 'bc');
  BAR_ID.classList.add(layout.barPos);
}

// 渲染布局页选项组
function renderPosGroup(container, opts, current, onChange) {
  container.innerHTML = '';
  for (const [key, label] of opts) {
    const b = document.createElement('button');
    b.className = 'btn' + (key === current ? ' on' : '');
    b.textContent = label;
    b.onclick = () => onChange(key, b);
    container.appendChild(b);
  }
}
function renderLayoutPage() {
  const quitOpts = [['tl','左上'],['tr','右上'],['bl','左下'],['br','右下']];
  const barOpts = [['bl','左下'],['br','右下'],['bc','底部居中']];
  renderPosGroup(document.getElementById('quit-pos-group'), quitOpts, layout.quitPos, (key) => {
    // 互斥：不能与菜单栏同角（bl/br）
    if ((key === 'bl' || key === 'br') && key === layout.barPos) {
      showToast('隐藏按钮与菜单栏不能同角');
      return;
    }
    layout.quitPos = key;
    saveLayout(); applyLayout(); renderLayoutPage();
    showToast('隐藏按钮：' + POS_LABEL[key]);
  });
  renderPosGroup(document.getElementById('bar-pos-group'), barOpts, layout.barPos, (key) => {
    // 互斥：barPos 的 bl/br 与 quitPos 同角时拒绝
    if (layout.quitPos === key) {
      showToast('菜单栏与隐藏按钮不能同角');
      return;
    }
    layout.barPos = key;
    saveLayout(); applyLayout(); renderLayoutPage();
    showToast('菜单栏：' + POS_LABEL[key]);
  });
}

// ---------- 设置面板（web 应用 / 快捷键 / 布局 / 通用） ----------
const settingsMask = document.getElementById('settings-mask');
let settingsMode = 'apps';
let capturing = null; // 正在捕获快捷键的目标：'main' 或 应用 id

function switchMenu(menu) {
  cancelCapture();
  settingsMode = menu;
  document.querySelectorAll('#s-menu .s-menu-item').forEach((b) => {
    b.classList.toggle('active', b.dataset.menu === menu);
  });
  document.getElementById('s-page-apps').classList.toggle('hidden', menu !== 'apps');
  document.getElementById('s-page-hotkey').classList.toggle('hidden', menu !== 'hotkey');
  document.getElementById('s-page-layout').classList.toggle('hidden', menu !== 'layout');
  document.getElementById('s-page-general').classList.toggle('hidden', menu !== 'general');
  if (menu === 'apps') renderAppList();
  else if (menu === 'hotkey') { renderHkList(); refreshPortalKeys(); }
  else if (menu === 'layout') renderLayoutPage();
  else if (menu === 'general') refreshAutostartBtn();
}

// portal 模式：绑定由系统对话框完成，打开快捷键页时拉取最新实际按键
function refreshPortalKeys() {
  if (hkBackend !== 'portal') return;
  atrayApi.getConfig().then((r) => {
    if (r.status === 'ok' && r.data.portal_keys && typeof r.data.portal_keys === 'object') {
      portalKeys = r.data.portal_keys;
      renderHkList();
    }
  });
}

function openSettings(menu) {
  switchMenu(menu || 'apps'); // 默认落在第一个菜单页（web 应用）
  settingsMask.style.display = 'flex';
  document.getElementById('bottom-bar').style.display = 'none'; // 面板下不露底栏
}
function closeSettings() {
  cancelCapture();
  settingsMask.style.display = 'none';
  document.getElementById('bottom-bar').style.display = '';
}

// ---------- 通用页（开机自启） ----------
const autostartBtn = document.getElementById('autostart-btn');
function refreshAutostartBtn() {
  atrayApi.getAutostart().then((r) => {
    const on = r.status === 'ok' && !!r.data.enabled;
    autostartBtn.textContent = on ? '已开启' : '已关闭';
    autostartBtn.classList.toggle('on', on);
  });
}
autostartBtn.onclick = () => {
  const want = !autostartBtn.classList.contains('on');
  atrayApi.setAutostart(want).then((r) => {
    const err = document.getElementById('autostart-err');
    if (r.status === 'ok') {
      autostartBtn.textContent = want ? '已开启' : '已关闭';
      autostartBtn.classList.toggle('on', want);
      err.textContent = '';
      showToast(want ? '已开启开机自动启动' : '已关闭开机自动启动');
    } else {
      err.textContent = String(r.data || '设置失败');
    }
  });
};

function normalizeHotkey(parts) {
  const mods = [];
  if (parts.alt) mods.push('Alt');
  if (parts.ctrl) mods.push('Ctrl');
  if (parts.shift) mods.push('Shift');
  const key = parts.key;
  if (!key) return null;
  return mods.concat(key).join('+');
}

// 快捷键页：总快捷键 + 各应用快捷键，全部可见可设/可删
// portal 模式（Wayland）：实际按键以系统对话框绑定结果为准（portalKeys），
// 未绑定/未确认时回落显示配置值
function hkDisplay(id, cfgVal) {
  if (hkBackend === 'portal') return portalKeys[id] || cfgVal || '';
  return cfgVal || '';
}
function renderHkList() {
  const mainValue = document.getElementById('main-hk-value');
  const mainShown = hkDisplay('toggle', mainHotkey);
  mainValue.textContent = mainShown || '（未设置）';
  mainValue.classList.toggle('empty', !mainShown);
  mainValue.title = (hkBackend === 'portal' && mainShown && mainShown !== mainHotkey)
    ? '系统实际分配的按键（配置为 ' + (mainHotkey || '无') + '）' : '';
  document.getElementById('main-hk-del').style.display = mainHotkey ? '' : 'none';
  if (hkBackend === 'portal') {
    document.getElementById('hk-label-main').textContent =
      '总快捷键：呼出/隐藏覆盖层（Wayland 下点「设置」后弹出系统对话框确认/修改按键；也可到系统设置 → 快捷键 → atray 修改）';
    document.getElementById('hk-label-app').textContent =
      '各 web 应用快捷键：按下直接切换到对应应用（Wayland 下同样经系统对话框确认；Alt+数字 快速切换仅 Windows/X11 支持）';
  }
  const list = document.getElementById('app-hk-list');
  list.innerHTML = '';
  if (!appCfgs.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color: var(--text-dim); font-size: 12px; padding: 6px 2px;';
    empty.textContent = '（暂无 web 应用，到「web 应用」页添加）';
    list.appendChild(empty);
    return;
  }
  for (const p of appCfgs) {
    const row = document.createElement('div');
    row.className = 'hk-row';
    row.dataset.target = p.id;
    const name = document.createElement('span');
    name.className = 'hk-name';
    name.textContent = p.name || p.id;
    name.title = p.url;
    const value = document.createElement('span');
    value.className = 'hk-value' + (p.hotkey ? '' : ' empty');
    value.textContent = hkDisplay('webapp:' + p.id, p.hotkey) || '（未设置）';
    const setBtn = document.createElement('button');
    setBtn.className = 'btn hk-set';
    setBtn.textContent = '设置';
    setBtn.onclick = () => startCapture(p.id);
    row.append(name, value, setBtn);
    if (p.hotkey) {
      // 删除该应用快捷键（即时注销）
      const delBtn = document.createElement('button');
      delBtn.className = 'btn';
      delBtn.textContent = '删除';
      delBtn.onclick = () => {
        p.hotkey = null;
        persistApps();
        renderHkList();
        renderBar();
        showToast('已删除「' + (p.name || p.id) + '」快捷键');
      };
      row.appendChild(delBtn);
    }
    list.appendChild(row);
  }
}

// 开始捕获快捷键（目标行高亮 + 提示）
function startCapture(target) {
  cancelCapture();
  capturing = target;
  document.querySelectorAll('.hk-row').forEach((r) => {
    r.classList.toggle('capturing', (target === 'main' && r.id === 'main-hk-row') ||
      (target !== 'main' && r.dataset.target === target));
  });
  showToast('按下新组合键（Alt/Ctrl/Shift + 键），Esc 取消');
}

function cancelCapture() {
  if (capturing === null) return;
  capturing = null;
  document.querySelectorAll('.hk-row.capturing').forEach((r) => r.classList.remove('capturing'));
  document.getElementById('hotkey-err').textContent = '';
}

// 捕获按键（设置面板打开时全局生效）
document.addEventListener('keydown', (e) => {
  if (settingsMask.style.display !== 'flex' || capturing === null) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.key === 'Escape') { cancelCapture(); return; }
  const parts = {alt: e.altKey, ctrl: e.ctrlKey, shift: e.shiftKey};
  const k = e.key;
  const mods = parts.alt || parts.ctrl || parts.shift;
  if (!mods) return;
  if (/^[A-Za-z0-9]$/.test(k)) parts.key = k.toUpperCase();
  else if (/^F([1-9]|1[0-2])$/.test(k)) parts.key = k;
  else return;
  if (!parts.alt && !parts.ctrl && parts.shift) return;
  const combo = normalizeHotkey(parts);
  const target = capturing;
  cancelCapture();
  if (target === 'main') {
    // 总快捷键：即时保存（Rust 注册/持久化）
    atrayApi.setHotkey(combo).then((r) => {
      if (r.status === 'ok') {
        mainHotkey = combo;
        renderHkList();
        if (hkBackend === 'portal') showToast('请在弹出的系统对话框中确认按键');
        else showToast('总快捷键：' + combo);
      } else {
        document.getElementById('hotkey-err').textContent = String(r.data || '设置失败');
      }
    });
  } else {
    // 应用快捷键：即时保存（config 持久化 + Rust 注册）
    const p = appCfgs.find((x) => x.id === target);
    if (p) {
      p.hotkey = combo;
      persistApps();
      renderHkList();
      renderBar();
      if (hkBackend === 'portal') showToast('「' + (p.name || p.id) + '」已保存，请在系统对话框中确认按键');
      else showToast('「' + (p.name || p.id) + '」快捷键：' + combo);
    }
  }
});

// ---------- web 应用管理页（顺序列：手填数字 或 拖拽整行） ----------
function reorderWebapp(from, to) {
  if (to === from || to < 0 || to >= appCfgs.length) return;
  const arr = appCfgs.slice();
  const t = arr.splice(from, 1)[0];
  arr.splice(to, 0, t);
  appCfgs = arr;
  renderAppList();
  renderBar(); // 工具栏顺序跟随（不动 iframe）
  persistApps();
}

function renderAppList() {
  const list = document.getElementById('app-list');
  list.innerHTML = '';
  if (!appCfgs.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'color: var(--text-dim); font-size: 12px; padding: 8px 4px;';
    empty.textContent = '（暂无 web 应用：输入 URL 添加）';
    list.appendChild(empty);
    return;
  }
  appCfgs.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'app-row';
    const drag = document.createElement('span');
    drag.className = 'drag';
    drag.textContent = '⠿';
    drag.title = '按住整行拖动排序';
    row.appendChild(drag);
    initRowDrag(row, i); // Pointer Events 拖动（不依赖 HTML5 DnD）
    row.appendChild(orderEl(i));
    row.appendChild(nameEl(p));
    row.appendChild(urlEl(p));
    row.appendChild(hotEl(p));
    row.appendChild(delBtn(p));
    list.appendChild(row);
  });
}

/* ---- 拖动排序：Pointer Events，实时换行 ----
   拖动期间 DOM 与 appCfgs 同步位移；松开后重排序号列并持久化。 */
let dragState = null;
function initRowDrag(row, i) {
  row.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('input,.btn')) return;
    dragState = { row, startY: e.clientY, moved: false, lastHover: -1 };
  });
}
window.addEventListener('pointermove', (e) => {
  if (!dragState) return;
  if (!dragState.moved) {
    if (Math.abs(e.clientY - dragState.startY) < 6) return;
    dragState.moved = true;
    dragState.row.classList.add('dragging');
    e.preventDefault();
  }
  const rows = Array.from(document.querySelectorAll('#app-list .app-row'));
  let hover = -1;
  for (let k = 0; k < rows.length; k++) {
    const r = rows[k].getBoundingClientRect();
    if (e.clientY >= r.top && e.clientY <= r.bottom) { hover = k; break; }
  }
  if (hover < 0 || hover === dragState.lastHover) return;
  const cur = rows.indexOf(dragState.row);
  if (cur < 0 || cur === hover) return;
  dragState.lastHover = hover;
  const target = rows[hover];
  if (cur < hover) target.after(dragState.row); else target.before(dragState.row);
  const arr = appCfgs.slice();
  const t = arr.splice(cur, 1)[0];
  arr.splice(hover, 0, t);
  appCfgs = arr;
  e.preventDefault();
});
window.addEventListener('pointerup', () => {
  if (!dragState) return;
  const moved = dragState.moved;
  if (dragState.row) dragState.row.classList.remove('dragging');
  dragState = null;
  if (moved) {
    renderAppList();
    renderBar();
    persistApps();
  }
});

// 行内元素构造器
function orderEl(i) {
  const order = document.createElement('input');
  order.className = 'order';
  order.type = 'text';
  order.inputMode = 'numeric';
  order.value = i + 1;
  order.title = '输入序号回车即移动到该位置';
  order.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') order.blur();
    if (e.key === 'Escape') { order.value = i + 1; order.blur(); }
  });
  order.addEventListener('blur', () => {
    const n = parseInt(order.value, 10);
    if (!isNaN(n) && n >= 1 && n <= appCfgs.length) {
      if (n - 1 !== i) reorderWebapp(i, n - 1);
    } else {
      order.value = i + 1;
    }
  });
  return order;
}
function nameEl(p) {
  const name = document.createElement('span');
  name.className = 'a-name';
  name.textContent = p.name || p.id;
  name.title = p.id;
  return name;
}
function urlEl(p) {
  const url = document.createElement('span');
  url.className = 'a-url';
  url.textContent = p.url;
  return url;
}
function hotEl(p) {
  const hot = document.createElement('span');
  hot.className = 'a-hot';
  hot.textContent = p.hotkey || '';
  return hot;
}
function delBtn(p) {
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = '删除';
  btn.onclick = () => {
    if (!confirm('删除 web 应用「' + (p.name || p.id) + '」？')) return;
    appCfgs = appCfgs.filter((x) => x.id !== p.id);
    removeWebapp(p.id); // 立即移除按钮/iframe/激活态（面板不用关也能看到）
    renderAppList();
    renderHkList();
    persistApps();
    showToast('已删除「' + (p.name || p.id) + '」');
  };
  return btn;
}

document.getElementById('p-add-btn').onclick = () => {
  const url = document.getElementById('p-url').value.trim();
  const name = document.getElementById('p-name').value.trim();
  if (!url) { showToast('请输入应用 URL'); return; }
  if (!/^(https?:\/\/|atray:\/\/)/.test(url)) {
    showToast('URL 需以 http(s):// 或 atray:// 开头');
    return;
  }
  const base = (name || url).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  let id = base || ('p' + Date.now());
  let i = 2;
  while (appCfgs.some((p) => p.id === id)) id = base + '-' + (i++);
  const p = {id, name: name || url, url};
  appCfgs.push(p);
  document.getElementById('p-url').value = '';
  document.getElementById('p-name').value = '';
  ensureWebapp(p); // 立即出现在状态栏（图标探测随后填充）
  renderAppList();
  renderHkList();
  persistApps();
  probeIcon(p);
  showToast('已添加「' + (name || url) + '」');
};

// ---------- 绑定 ----------
document.querySelectorAll('#s-menu .s-menu-item').forEach((b) => {
  b.onclick = () => switchMenu(b.dataset.menu);
});
document.getElementById('main-hk-btn').onclick = () => startCapture('main');
document.getElementById('main-hk-del').onclick = () => {
  atrayApi.clearHotkey().then((r) => {
    if (r.status === 'ok') {
      mainHotkey = null;
      renderHkList();
      showToast('总快捷键已删除（托盘仍可呼出）');
    } else {
      document.getElementById('hotkey-err').textContent = String(r.data || '删除失败');
    }
  });
};
document.getElementById('s-ok').onclick = closeSettings;
document.getElementById('settings-btn').onclick = () => { openSettings(); };
document.getElementById('main-panel-btn').onclick = () => activateWebapp(null);
document.getElementById('add-webui-btn').onclick = () => openSettings('apps');
document.getElementById('quit-btn').onclick = () => atrayApi.hide();
document.getElementById('add-webui-btn').onclick = () => openSettings('apps');
document.getElementById('quit-btn').onclick = () => atrayApi.hide();

// 启动
window.addEventListener('DOMContentLoaded', async () => {
  loadLayout();
  applyLayout();
  try {
    const r = await atrayApi.getConfig();
    if (r.status === 'ok') {
      if (typeof r.data.hotkey === 'string') mainHotkey = r.data.hotkey;
      else mainHotkey = null;
      if (r.data.webapps) appCfgs = r.data.webapps;
      if (r.data.backend) hkBackend = r.data.backend;
      if (r.data.portal_keys && typeof r.data.portal_keys === 'object') portalKeys = r.data.portal_keys;
    }
  } catch (e) {}
  buildWebappUI();
  if (appCfgs.length) activateWebapp(appCfgs[0].id);
  else activateWebapp(null);
  // 已有应用无图标 → 尝试探测 favicon（命中后自动更新按钮并持久化）
  for (const p of appCfgs) probeIcon(p);
});
